```html
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Assistant Vide-Grenier</title>
<link rel="manifest" href="manifest.json">
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 500px;
    margin: 0 auto;
    padding: 16px;
    background: #f5f5f5;
  }
  h1 { font-size: 20px; text-align: center; color: #333; }
  #preview {
    width: 100%;
    max-height: 300px;
    object-fit: contain;
    border-radius: 8px;
    margin: 12px 0;
    display: none;
  }
  input[type="file"] { display: none; }
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    text-align: center;
    cursor: pointer;
  }
  .btn:disabled { background: #93c5fd; }
  #resultat {
    background: white;
    border-radius: 8px;
    padding: 16px;
    margin-top: 16px;
    display: none;
  }
  #resultat h2 { font-size: 16px; margin-top: 0; }
  #resultat textarea {
    width: 100%;
    box-sizing: border-box;
    min-height: 100px;
    font-size: 14px;
    padding: 8px;
  }
  #chargement { text-align: center; display: none; margin: 16px 0; }
</style>
</head>
<body>

<h1>📦 Mon Assistant Vide-Grenier</h1>

<img id="preview" alt="aperçu">

<label for="photo" class="btn">📷 Prendre une photo</label>
<input type="file" id="photo" accept="image/*" capture="environment">

<button id="analyser" class="btn" disabled>✨ Analyser cet objet</button>

<div id="chargement">⏳ Analyse en cours...</div>

<div id="resultat">
  <h2>Titre de l'annonce</h2>
  <textarea id="titre" readonly></textarea>

  <h2>Description</h2>
  <textarea id="description" readonly style="min-height:180px;"></textarea>

  <h2>Estimation du prix</h2>
  <textarea id="prix" readonly style="min-height:60px;"></textarea>
</div>

<script src="app.js"></script>
</body>
</html>
```
